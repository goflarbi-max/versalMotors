[theme]
base = "light"
primaryColor = "#4F46E5"
baseRadius = "large"
showWidgetBorder = true
showSidebarBorder = true
font = "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
headingFont = "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
baseFontSize = 16
baseFontWeight = 400
headingFontWeights = [700, 700, 600, 600, 600, 600]

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-400.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-500.woff2"
weight = 500
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-600.woff2"
weight = 600
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-700.woff2"
weight = 700
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[theme.light]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#4F46E5"
greenColor = "#10B981"
orangeColor = "#F59E0B"
redColor = "#EF4444"

[theme.dark]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"
primaryColor = "#6366F1"
greenColor = "#10B981"
orangeColor = "#F59E0B"
redColor = "#EF4444"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
borderColor = "#E2E8F0"

[theme.dark.sidebar]
backgroundColor = "#020617"
secondaryBackgroundColor = "#0F172A"
textColor = "#F1F5F9"
borderColor = "#1E293B"

[server]
enableStaticServing = true
